name: Build and deploy Grill-Me

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grill-me-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix api ci

      - name: Check API source
        run: npm --prefix api run check

      - name: Build frontend
        run: npm run build

      - name: Verify Static Web Apps deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/staticwebapp.config.json
          test -s api/host.json
          test -s api/package.json
          node -e "const c=require('./dist/staticwebapp.config.json'); if(c.platform?.apiRuntime!=='node:22' || c.auth?.rolesSource!=='/api/roles' || !c.routes?.some(r=>r.route==='/*' && r.allowedRoles?.length===1 && r.allowedRoles[0]==='grill-member')) throw new Error('Invalid managed API or access configuration')"

      - name: Check deployment token is configured
        if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SWA_TOKEN" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is missing from GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ""
          skip_app_build: true
